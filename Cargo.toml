[package]
name = "ai-server"
version = "0.1.0"
edition = "2021"
description = "Lightweight, cross-platform AI server in Rust with OpenAI-compatible streaming and responsive WebUI"
authors = ["Maran <ai.maran.co.in>"]
readme = "README.md"
license = "MIT"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dotenvy = "0.15"
uuid = { version = "1.9", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rust-embed = { version = "8.4", features = ["interpolate-folder-path"], optional = true }
mime_guess = { version = "2.0", optional = true }

[features]
default = []
embed-frontend = ["dep:rust-embed", "dep:mime_guess"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
