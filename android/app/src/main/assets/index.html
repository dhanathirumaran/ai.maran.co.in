<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>General Bot &bull; ai.maran.co.in</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
</head>
<body class="light-theme">
  <div class="app-container">
    <!-- Main Content Area (Single Dedicated Bot) -->
    <main class="main-content">
      <!-- Clean Top Navbar -->
      <header class="navbar">
        <div class="bot-header">
          <div class="bot-avatar">🤖</div>
          <div class="bot-meta">
            <span class="bot-title">General Bot</span>
            <span class="bot-status">
              <span class="status-dot"></span>
              Online
            </span>
          </div>
        </div>
      </header>

      <!-- Chat History Container -->
      <section class="messages-container" id="messagesContainer">
        <!-- Welcome Screen -->
        <div class="welcome-screen" id="welcomeScreen">
          <div class="welcome-card">
            <div class="welcome-avatar">🤖</div>
            <h2>Hello! I'm General Bot</h2>
            <p>Your versatile personal AI companion. Ask me anything, explore code, analyze complex ideas, or brainstorm solutions.</p>
            <div class="prompt-chips">
              <button class="chip" data-prompt="Explain how you work and what capabilities you have">What can you do?</button>
              <button class="chip" data-prompt="Write an interactive HTML/JS stopwatch artifact with Start, Stop, and Lap buttons">Interactive HTML Stopwatch</button>
              <button class="chip" data-prompt="Help me design a clean, modular architecture for a solo developer project">Architecture Best Practices</button>
            </div>
          </div>
        </div>

        <!-- Chat messages injected here -->
        <div class="messages-list" id="messagesList"></div>
      </section>

      <!-- Attachment Preview Tray -->
      <div class="attachment-tray" id="attachmentTray"></div>

      <!-- Composer Input Box (Floating Capsule) -->
      <footer class="composer-container">
        <form class="composer-form" id="chatForm">
          <input type="file" id="fileInput" multiple style="display: none;">
          <button type="button" class="icon-btn attach-btn" id="attachBtn" title="Attach file or image">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>

          <textarea
            id="messageInput"
            rows="1"
            placeholder="Message General Bot... (Shift+Enter for newline)"
            autofocus
          ></textarea>

          <button type="button" class="icon-btn stop-btn" id="stopBtn" style="display: none;" title="Stop generation">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="6" width="12" height="12" rx="2"></rect>
            </svg>
          </button>

          <button type="submit" class="icon-btn send-btn" id="sendBtn" title="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
        <div class="composer-hint">Type "reset memory" anytime to start fresh &bull; Shift + Enter for new line</div>
      </footer>
    </main>
  </div>

  <!-- Artifact Fullscreen Modal -->
  <div class="modal artifact-modal" id="artifactModal">
    <div class="modal-card artifact-modal-card">
      <div class="modal-header">
        <div class="artifact-modal-title">
          <span class="artifact-icon">⚡</span>
          <span id="artifactModalName">Live Preview</span>
        </div>
        <div class="artifact-modal-actions">
          <button class="icon-btn" id="reloadArtifactBtn" title="Reload Preview">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
          </button>
          <button class="icon-btn" id="closeArtifactModal" title="Close Preview">&times;</button>
        </div>
      </div>
      <div class="modal-body artifact-modal-body">
        <iframe id="artifactModalFrame" sandbox="allow-scripts allow-modals" class="artifact-modal-iframe"></iframe>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
