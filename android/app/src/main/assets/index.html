<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Studio &bull; ai.maran.co.in</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
</head>
<body class="dark-theme">
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="btn btn-primary new-chat-btn" id="newChatBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New Chat</span>
        </button>
        <button class="icon-btn close-sidebar-btn" id="closeSidebarBtn" title="Close Sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="sidebar-search">
        <input type="text" id="searchChats" placeholder="Search conversations..." autocomplete="off">
      </div>

      <div class="sidebar-conversations" id="conversationsList">
        <!-- Conversation items dynamically injected here -->
      </div>

      <div class="sidebar-footer">
        <button class="footer-btn" id="openAgentBoardBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <line x1="3" y1="9" x2="21" y2="9"></line>
          </svg>
          <span>Agent Board & Handoffs</span>
        </button>
        <button class="footer-btn" id="openPersonasBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>System Personas</span>
        </button>
        <button class="footer-btn" id="openSettingsBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Settings</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Navbar -->
      <header class="navbar">
        <div class="navbar-left">
          <button class="icon-btn" id="toggleSidebarBtn" title="Toggle Sidebar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="logo">
            <span class="logo-accent">AI</span>
            <span class="logo-title">Maran</span>
          </div>
        </div>

        <div class="navbar-center">
          <div class="model-badge" id="currentModelBadge" title="Click to change model">
            <span class="status-dot"></span>
            <span id="activeModelLabel">gemini-2.0-flash</span>
          </div>
        </div>

        <div class="navbar-right">
          <button class="icon-btn" id="themeToggleBtn" title="Toggle Light/Dark Theme">
            <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Chat History Container -->
      <section class="messages-container" id="messagesContainer">
        <!-- Welcome Screen -->
        <div class="welcome-screen" id="welcomeScreen">
          <div class="welcome-card">
            <div class="welcome-icon">✨</div>
            <h2>What would you like to build or explore?</h2>
            <p>High-performance personal AI server running on Rust & Axum.</p>
            <div class="prompt-chips">
              <button class="chip" data-prompt="Explain how this Rust Axum server streams SSE tokens to the browser">Explain Axum SSE</button>
              <button class="chip" data-prompt="Help me design an Android APK background service for this Rust server">Android APK Integration</button>
              <button class="chip" data-prompt="Write an idiomatic Rust function to parse JSON streams with zero allocation">Idiomatic Rust</button>
            </div>
          </div>
        </div>

        <!-- Chat messages injected here -->
        <div class="messages-list" id="messagesList"></div>
      </section>

      <!-- Attachment Preview Tray -->
      <div class="attachment-tray" id="attachmentTray"></div>

      <!-- Composer Input Box -->
      <footer class="composer-container">
        <form class="composer-form" id="chatForm">
          <input type="file" id="fileInput" multiple style="display: none;">
          <button type="button" class="icon-btn attach-btn" id="attachBtn" title="Attach image or text/code file">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>

          <textarea
            id="messageInput"
            rows="1"
            placeholder="Type your message... (Shift+Enter for newline)"
            autofocus
          ></textarea>

          <button type="button" class="icon-btn stop-btn" id="stopBtn" style="display: none;" title="Stop generation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="6" width="12" height="12" rx="2"></rect>
            </svg>
          </button>

          <button type="submit" class="icon-btn send-btn" id="sendBtn" title="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
        <div class="composer-hint">Press Enter to send &bull; Shift + Enter for new line</div>
      </footer>
    </main>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Server & LLM Settings</h3>
        <button class="icon-btn" id="closeSettingsModal">&times;</button>
      </div>
      <div class="modal-body">
        <label>Quick Provider Presets</label>
        <div class="provider-presets">
          <button type="button" class="preset-btn" data-preset="omni">PulseMind Omni</button>
          <button type="button" class="preset-btn" data-preset="gemini">Google Gemini</button>
          <button type="button" class="preset-btn" data-preset="groq">Groq</button>
          <button type="button" class="preset-btn" data-preset="openai">OpenAI</button>
          <button type="button" class="preset-btn" data-preset="ollama">Local Ollama</button>
          <button type="button" class="preset-btn" data-preset="deepseek">DeepSeek</button>
        </div>

        <div class="form-group">
          <label for="settingServerUrl">Server URL (Optional)</label>
          <input type="text" id="settingServerUrl" placeholder="Leave empty for direct API mode, or https://ai.maran.co.in">
        </div>

        <div class="form-group">
          <label for="settingBaseUrl">API Base URL</label>
          <input type="text" id="settingBaseUrl" placeholder="https://generativelanguage.googleapis.com/v1beta/openai/">
        </div>

        <div class="form-group">
          <label for="settingApiKey">API Key</label>
          <div class="password-wrapper">
            <input type="password" id="settingApiKey" placeholder="Enter custom API Key (stored locally)">
            <button type="button" class="toggle-password-btn" id="toggleKeyVisibility" title="Show/Hide Key">👁️</button>
          </div>
        </div>

        <div class="form-group">
          <label for="settingModel">Model Identifier</label>
          <input type="text" id="settingModel" placeholder="gemini-2.0-flash">
        </div>

        <div class="form-group">
          <label for="settingSystemPrompt">Custom System Prompt</label>
          <textarea id="settingSystemPrompt" rows="3" placeholder="You are a helpful AI assistant..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group half">
            <label for="settingTemperature">Temperature: <span id="tempVal">0.7</span></label>
            <input type="range" id="settingTemperature" min="0" max="2" step="0.1" value="0.7">
          </div>
          <div class="form-group half">
            <label for="settingMaxTokens">Max Output Tokens</label>
            <input type="number" id="settingMaxTokens" placeholder="4096" min="256" max="32768" value="4096">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="resetSettingsBtn">Reset to Defaults</button>
        <button class="btn btn-primary" id="saveSettingsBtn">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Personas Modal -->
  <div class="modal" id="personasModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>System Personas</h3>
        <button class="icon-btn" id="closePersonasModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="personas-list" id="personasList">
          <!-- Personas dynamically loaded here -->
        </div>

        <hr class="divider">
        <h4>Create Custom Persona</h4>
        <div class="form-group">
          <label for="newPersonaTitle">Persona Title</label>
          <input type="text" id="newPersonaTitle" placeholder="e.g. Rust Systems Expert">
        </div>
        <div class="form-group">
          <label for="newPersonaDesc">Description</label>
          <input type="text" id="newPersonaDesc" placeholder="e.g. Specializes in low-level memory safety">
        </div>
        <div class="form-group">
          <label for="newPersonaPrompt">System Instructions</label>
          <textarea id="newPersonaPrompt" rows="3" placeholder="You are a specialized AI..."></textarea>
        </div>
        <button class="btn btn-primary" id="saveNewPersonaBtn">Add Persona</button>
      </div>
    </div>
  </div>

  <!-- Artifact Fullscreen Modal -->
  <div class="modal artifact-modal" id="artifactModal">
    <div class="modal-card artifact-modal-card">
      <div class="modal-header">
        <div class="artifact-modal-title">
          <span class="artifact-icon">⚡</span>
          <span id="artifactModalName">Live Preview</span>
        </div>
        <div class="artifact-modal-actions">
          <button class="icon-btn" id="reloadArtifactBtn" title="Reload Preview">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
          </button>
          <button class="icon-btn" id="closeArtifactModal" title="Close Preview">&times;</button>
        </div>
      </div>
      <div class="modal-body artifact-modal-body">
        <iframe id="artifactModalFrame" sandbox="allow-scripts allow-modals" class="artifact-modal-iframe"></iframe>
      </div>
    </div>
  </div>

  <!-- Agent Board & Harness Modal -->
  <div class="modal agent-board-modal" id="agentBoardModal">
    <div class="modal-card agent-board-card">
      <div class="modal-header">
        <div class="agent-board-header-title">
          <span class="board-badge">📋</span>
          <h3>Solo Runtime Agent Harness</h3>
        </div>
        <button class="icon-btn" id="closeAgentBoardModal">&times;</button>
      </div>
      <div class="modal-body agent-board-body">
        <div class="board-nav-tabs">
          <button class="board-tab-btn active" data-tab="board">Master Board</button>
          <button class="board-tab-btn" data-tab="handoffs">Handoffs</button>
          <button class="board-tab-btn" data-tab="tasks">Tasks</button>
          <button class="board-tab-btn" data-tab="context">Context Library</button>
          <button class="board-tab-btn" data-tab="charter">Charter & Safety</button>
        </div>

        <div class="board-tab-content active" id="tabContentBoard">
          <div class="board-markdown" id="boardMarkdownView"></div>
        </div>

        <div class="board-tab-content" id="tabContentHandoffs">
          <div class="handoffs-list" id="handoffsList"></div>
        </div>

        <div class="board-tab-content" id="tabContentTasks">
          <div class="tasks-pipeline-list" id="tasksPipelineList"></div>
        </div>

        <div class="board-tab-content" id="tabContentContext">
          <div class="context-doc-selector">
            <button class="context-pill active" data-doc="architecture">Architecture</button>
            <button class="context-pill" data-doc="conventions">Conventions</button>
            <button class="context-pill" data-doc="glossary">Glossary</button>
          </div>
          <div class="context-doc-view" id="contextDocView"></div>
        </div>

        <div class="board-tab-content" id="tabContentCharter">
          <div class="charter-markdown" id="charterMarkdownView"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
